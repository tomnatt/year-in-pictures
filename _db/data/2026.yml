    description: "Coloured light spills outwards from a dark ink void created by the scission. The thin score-like division or split down the centre of this photograph is sunlight at dusk reflected on the surface of Lake 12 at South Cerney in Gloucestershire. Inverted 90 degrees the light patterns and symmetry of sunset in the photograph take on an abstract and void-like quality."
