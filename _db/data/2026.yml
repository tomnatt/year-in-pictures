    image: 05-matt_hobbs.jpg
    image_title: "Hike Snowdon"
    caption: "On top of Wales"
    description: "For the past two years, we’ve been trying to make this trip to Snowdon in North Wales happen. Unfortunately, life had other ideas, and we’ve had to postpone it twice. Deposits paid, accommodation booked, plans made… and then cancelled.<br ><br >So naturally, when we finally managed to get there, it coincided with the hottest week in May since 1922. Timing, as ever, impeccable.<br ><br >I’d love to say the hike was pleasant, but with temperatures nudging 28 °C and approximately zero shade anywhere on the mountain, it was less of a scenic walk and more of a slow-moving endurance test. The climb up was tough, the walk down somehow felt even worse, and my feet and legs are still considering whether to forgive me.<br ><br >That said, the views from the summit were absolutely incredible and made the suffering almost worthwhile. I’m also incredibly proud that both boys made it all the way to the top. Our guide mentioned that he didn’t summit Snowdon until he was 17, so for a 9-year-old and an 11-year-old, I think that’s a pretty impressive achievement.<br ><br >I’d definitely consider walking it again. Ideally, on a day when the weather has remembered that it’s Wales, not the Sahara desert!"
    alt: "View from the top of Snowdon on one of the hottest days of the year, the 2 lakes seen were cricial in cooling down on the way down! Visability wasn't great but still a stunning view!"
    month: may
    photographer: 78
