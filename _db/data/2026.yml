    image: 03-gareth.jpg
    image_title: "Gatwick Nando's"
    caption: "Gatwick Nando's"
    description: "My mum has a bunch of photos from the late 1970s of someone bringing \"Pong\" round to her mum and dad's house. They plugged it in and played it and, in the photos, you can see they can't believe what's happening. They are posing next to my grandmother's enormous wood paneled TV while a blocky, tennis-like game takes place. It's funny that a console, a piece of technology which is now so ingrained into the fabric of day to day life, was once so exciting that they felt obliged to take a photograph of it. Maybe all technology starts like this? A huge leap forward, which is so exciting it is worthy of recording with photography. However one day, it passes into ubiquity. So what is that item today? What is a jaw dropping image today which, one day, will be so commonplace, we would scarcely give it a second thought?<br ><br >Is this tomorrow's norm? Do we dare to dream?"
    alt: "A scene from Nando's. A shelf of the normal sauces available, as normal - however in front of those is a dispenser, looking like the taps in a pub, with a nozzle for each flavour of source. It is a bright orange set of pumps dispensing Nando's sauce on-tap in flavours (Left to Right) - Lemon & Herb, Medium, Wild Herb, Garlic, Hot, Extra Hot. There is a drip tray under the whole thing."
