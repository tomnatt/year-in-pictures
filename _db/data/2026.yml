    image: 04-sue.jpg
    image_title: "A plethora of images"
    caption: "A plethora of images"
    description: "Featuring firstly the beautiful Holly Blue Butterfly taken by my daughter in her garden in The Wirral, and on the right 'The Aliens have landed!' - a friend of mine and her husband are seen here with an instructor on the way to set up two beehives at the bottom of their garden backing on to woods. A great new venture!<br ><br >The centre photo is a gorgeous waterfall in Penllegaer Park in Swansea, a lovely big wooded garden which used to be part of a private estate. Over time the estate fell to rack and ruin however it has been and is still being lovingly restored by a group of local volunteers from the community who formed a Trust to keep the garden for the public to enjoy. There is a cafe and shop near the car park - a treasure of a place with many great walks.<br ><br >At the bottom left is a Little Grebe we saw sitting on five eggs. A first sighting for us, sadly we couldn’t get near enough to take a better photo. And finally for the crafters among you, this pretty doll was crocheted by Janet - a clever member of my craft group. I think she is fabulous! Sadly her pretty shoes are cut out of the picture."
    alt: "Five photos making up this collage. The first is the gorgeous Holly Blue Butterfly taken by my daughter in her garden in the Wirral. Second right is a photo of my friend , her partner and an instructor all suitably dressed in hooded protective  garb ready to set up two beehives at the bottom of their garden. The central photo is of a gorgeous large waterfall in the fabulous Penllegaer Park in Swansea. Bottom left is a cute Little Grebe we spotted sitting on a nest of five eggs. Finally a cute crochetted doll complete with ringlets, hat and lovely outfit ( for crafters among us)."
