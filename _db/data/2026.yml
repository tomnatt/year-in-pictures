    image_title: "Morning walk to school"
    caption: "Frosty morning walk"
    description: "My youngest son is in primary school, and since we moved house, the school run has gone from a quick 3-minute stroll to a full 20-minute walk! 😅<br ><br >To make things even more fun, our new build estate still hasn’t been officially adopted by the local council. That means none of the roads or pavements get gritted, which turns the walk into a bit of an obstacle course when it’s icy. It was especially sketchy during the cold snap at the start of January!<br ><br >This photo was taken on one of those walks to school. On the bright side, at least it wasn’t raining 🤣"
    alt: "The winter sun cuming over the houses in the distance on a cold and frosty morning in January."
