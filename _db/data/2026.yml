    description: "We had a wonderful week on Guernsey with near perfect weather.  Our rental cottage was charming and the garden exquisite.  We have never visited the Channel Islands and especially enjoyed our day on Herm - just a 20 minute boat ride from St. Peter’s Port. <br ><br >You could not walk far from the coast without encountering the German WW2 fortifications. It is thought over 800 remain.  The photo is of the MP4 L’Angle Observation Tower.  There are at least 2 others remaining (one is occasionally opened for visits) on the island. The fortification is privately owned and has not yet been restored. It is made entirely of concrete  - the walls and roof are over 2 meters thick. A visual reminder of a sad time in the history of Guernsey."
