    image: 04-tim_blair.jpg
    image_title: "BBEG"
    caption: "BBEG"
    description: "This month saw the culmination of 2+ years of our in-person D&D campaign, seeing our intrepid party take on the BBEG who was trying to reignite a magical forge to save her brother from otherworldly corruption, knowing that it was going to cause some unpleasant side effects on the wider world.<br ><br >To mark this occasion, I broke out the crafting materials and the 3D printer to build and paint a full battle map including board, walls, terrain, and all the monsters and NPCs.<br ><br >It all came down to a single die roll, with success sealing the rift that had been opened between planes, and failure meaning the denizens of the Far Realm spilling through to the material plane, and the party being wiped out. Thankfully, for the players, things worked out, and the rift was sealed.<br ><br >However, the BBEG got away, and now holds the party directly responsible for the death of her brother. To be continued..."
    alt: "A tabletop RPG dungeon scene featuring painted miniatures on a gridded stone-tile game board enclosed by rocky walls. The setup includes a central stone archway with a robed figure, several purple tentacled creature miniatures, a red multi-eyed monster, a corrupted warrior figure, a swirling well, decorative stone pillars, and scatter terrain including wooden crates and barrels. The board features a circular pattern of coloured tiles in red, blue, green, and yellow."
