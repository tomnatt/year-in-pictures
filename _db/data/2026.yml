    image: 03-sue.jpg
    image_title: "‘Rush Time Chaos’"
    caption: "‘Rush Time Chaos’"
    description: "A friend of mine recently took this photo at a fabulous Textile Exhibition in Sitges, Spain. It is so amazing I asked her if I could use it for my photo of the month.  This piece is quilted and embroidered and won ‘Best in Show’. It was created by Eva Garmendia. She also won awards at the Houston International Quilt Festival 2024 for another creation called ‘The Library’ and is super talented."
    alt: "An amazing quilted and embroidered panel of a red and black steam train just pulling in to a Victorian looking station with lots of glass windows and glass roof. Passengers with suitcases are waiting on the platform . It’s a fabulous piece created by Eva Garmendia, at a Textile Exhibition in Sitges, Spain. She won ‘Best in Show’ which was well deserved."
