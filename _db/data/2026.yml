    image_title: "Ancient mysteries"
    caption: "Ancient mysteries"
    description: "The 16-tonne capstone of the Pentre Ifan monument has laid poised on the points of three upright stones for over 5000 years. This ancient monument in the Pembrokeshire countryside was constructed from local bluestone - the same stone that was carried from Wales's Preseli Hills to build Stonehenge some 180 miles away. There is something powerfully moving about the intimacy of Pentre Ifan's unassuming setting and the wonder of its seemingly impossibly balanced stone that has stayed in situ for thousands of years. And unlike Stonehenge, Pentre Ifan is a monument that is cared for and protected without fencing or ticket booths. On that February day, I was able to stand alone in its presence listening to the peaceful sound of rain and birds and pondering its mysteries."
    alt: "Ancient standing stone monument in green fields. A large flat stone lies upon three pointed standing stones in what appears to be impossible balance."
    month: february
    photographer: 106
