  -
    image: 03-teresa.jpg
    image_title: "In a nutshell..."
    caption: "In a nutshell..."
    description: "I have mice in the leek bed!  Fortunately they don't seem to like leeks, preferring to trek through the bark paths carrying hazelnuts, climb up the 30cm high smooth plastic sides of the raised beds (how?) to this feasting spot.  Their front garden cousins carry walnuts through the jungle (lawn) and the border, under the gate and across the great gobi desert of the garage aprons, then under the garage door to the woodpile where they make a nest adjacent to their pantry. I usually find the nest and empty shells when I burn the last logs at this time of year & feel guilty every time. This year they had variety with hazelnuts too having hauled half their cache from the back tree. I promise not to winge about going to Tesco!"
    alt: "Neatly opened nutshells left by mice"
    month: march
    photographer: 21
